<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista 3</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Verdana, sans-serif;
            background: linear-gradient(135deg, #fff8e1 0%, #fdf1c8 50%, #fce9a8 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            color: #6b5a1e;
        }

        .container {
            background-color: #fffdf5;
            border-radius: 24px;
            padding: 48px 40px;
            max-width: 560px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(210, 180, 60, 0.18);
            border: 1px solid #f3e2a0;
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            color: #a8871a;
            margin-bottom: 8px;
            font-weight: 700;
        }

        h1::after {
            content: "";
            display: block;
            width: 60px;
            height: 4px;
            background: #f6c945;
            border-radius: 4px;
            margin: 12px auto 0;
        }

        h2 {
            font-size: 1rem;
            font-weight: 500;
            color: #9c8748;
            margin: 24px 0 32px;
            line-height: 1.5;
            letter-spacing: 0.3px;
        }

        .exercicios {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        a {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
            background-color: #fdf2c4;
            color: #8a6d16;
            font-weight: 600;
            font-size: 1.05rem;
            padding: 16px 24px;
            border-radius: 14px;
            border: 1.5px solid #f0dd94;
            transition: all 0.25s ease;
        }

        a::before {
            font-size: 1.1rem;
        }

        a:hover {
            background-color: #f6c945;
            color: #5c4a10;
            transform: translateY(-3px);
            box-shadow: 0 8px 18px rgba(246, 201, 69, 0.4);
            border-color: #f6c945;
        }

        a:active {
            transform: translateY(-1px);
        }

        footer {
            margin-top: 32px;
            font-size: 0.8rem;
            color: #c2ac5f;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Lista - 3</h1>
        <h2>JAVASCRIPT – FORMULÁRIOS<br>LISTA DE EXERCÍCIOS</h2>

        <div class="exercicios">
            <a href="ex01/index.html">Exercício 1</a>
            <a href="ex02/index.html">Exercício 2</a>
            <a href="ex03/index.html">Exercício 3</a>
            <a href="ex04/index.html">Exercício 4</a>
            <a href="ex05/index.html">Exercício 5</a>
            <a href="ex06/index.html">Exercício 6</a>
            <a href="ex07/index.html">Exercício 7</a>
        </div>

        <footer>Clique em um exercício para começar</footer>
    </div>
</body>
</html>
