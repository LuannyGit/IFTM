<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <a href="../index.html">Voltar ao menu</a>
    <script>
        texto = prompt("Digite um texto: ");
        textos = texto.split(" ");

        primeira = textos[0];
        
        ultima = textos[textos.length - 1];

        resultado = primeira + " " + ultima;

        document.write("<p>" + resultado + "</p>");
    </script>
</body>
</html>
