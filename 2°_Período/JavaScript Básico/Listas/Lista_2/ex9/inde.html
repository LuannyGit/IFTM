<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de Palíndromo Simples</title>
</head>
<body>
    <a href="../index.html">Voltar ao menu</a>

    <script>
        let texto = prompt("Digite uma palavra ou frase:");

        let textoMinusculo = texto.toLowerCase();

        let textoSemEspaco = "";
        for (let i = 0; i < textoMinusculo.length; i++) {
            if (textoMinusculo[i] !== " ") {
                textoSemEspaco += textoMinusculo[i];
            }
        }

        let textoInvertido = "";
        for (let i = textoSemEspaco.length - 1; i >= 0; i--) {
            textoInvertido += textoSemEspaco[i];
        }

        if (textoSemEspaco === textoInvertido) {
            alert("O texto '" + texto + "' É um palíndromo!");
        } else {
            alert("O texto '" + texto + "' NÃO é um palíndromo.");
        }
    </script>
</body>
</html>
