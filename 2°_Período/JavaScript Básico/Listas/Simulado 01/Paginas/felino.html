<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Jogo dos Felinos</title>
</head>
<body>
    <div class="caixaGatos">
        <div class="caixafe">
            <img src="../Imagens/gato01.gif" alt="" id="felino01">
            <p></p>
            <p>Clique em mim!</p> 
            <p></p>
        </div>
        <div class="caixafe">
            <img src="../Imagens/gato02.gif" alt="" id="felino02">
            <p>Clique sobre mim varias vezes!</p>
        </div>
        <div class="caixafe">
            <img src="../Imagens/gato03.gif" alt="" id="felino03">
            <p>Passe o cursor do mouse sobre mim!</p>
        </div>
        <div class="caixafe">
            <img src="../Imagens/gato04.gif" alt="" id="felino04">
            <p></p>
            <p><span id="cocegas">lá lá lá lá lá lá</span></p>
            <p></p>
        </div>
        <div class="caixafe">
            <img src="../Imagens/gato05.gif" alt="" id="felino05">
            <input type="button" value="Gerar número da sorte" id="btnSorte">
            <input type="text" name="" id="numeroSorte">
        </div>
        <p id="carinho">Carinhos: <span id="carinhos">0</span></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
